[package]
name = "danxi-core"
version = "0.1.0"
edition = "2024"
description = "Shared application services for DanXi Next web and desktop runtimes"

[dependencies]
aes = "0.8"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cfb-mode = "0.8"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["cookies", "form", "json", "query", "rustls", "system-proxy"] }
regex = "1"
rsa = { version = "0.9", default-features = false }
rand_core = { version = "0.6", features = ["std", "getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }
urlencoding = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
