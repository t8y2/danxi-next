[package]
name = "danxi-server"
version = "0.1.0"
edition = "2024"
description = "Web API gateway for DanXi"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
danxi-core = { path = "../danxi-core" }
dotenvy = "0.15"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "time"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
